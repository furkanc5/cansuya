<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cansu'nun Güzelliği ✨</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; 
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
    color:#2b2b2b;
    font-family:'Nunito', 'Segoe UI', Arial, sans-serif;
    min-height:100vh; display:flex; justify-content:center; align-items:center;
    overflow-x:hidden;
  }
  .wrap{width:min(1100px,100%);padding:18px 14px 28px}
  h1{
    text-align:center;font-size:clamp(25px,6vw,50px);margin:0 0 16px;font-weight:900;
    color: #fff; text-shadow: 0 3px 6px rgba(0,0,0,0.15);
    letter-spacing: 1px;
  }
  .card{
    border:none;border-radius:24px;padding:20px;
    background:rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    box-shadow:0 15px 35px rgba(0,0,0,0.12);
  }
  canvas{display:block;width:100%;height:auto;touch-action:none}
  .controls{margin-top:16px;display:grid;gap:12px}
  .row{display:flex;align-items:center;gap:12px}
  
  /* Tatlı Range Slider Tasarımı */
  input[type=range]{
    width:100%;
    -webkit-appearance: none;
    background: #ffd3e0;
    height: 12px;
    border-radius: 8px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ff477e;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(255, 71, 126, 0.4);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  button{
    border:none; background:linear-gradient(135deg, #ff477e 0%, #ff7096 100%);
    color:#fff;border-radius:14px;
    padding:12px 20px;font-size:18px;font-weight:800;cursor:pointer;
    box-shadow: 0 5px 15px rgba(255, 71, 126, 0.3);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 20px rgba(255, 71, 126, 0.4);
  }
  button:active {
    transform: translateY(0);
  }

  .value{
    text-align:center;font-size:19px;font-weight:800;min-height:24px;
    color: #ff477e;
  }
  .hint{text-align:center;font-size:13px;color:#777;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CANSU'NUN GÜZELLİĞİ ✨💖</h1>
  <div class="card">
    <canvas id="chart"></canvas>
    <div class="controls">
      <div class="row">
        <input id="time" type="range" min="0" max="100" value="0" aria-label="Zaman">
        <button id="play">▶</button>
      </div>
      <div class="value" id="label">Başlangıç: Çok çok güzel</div>
      <div class="hint">Grafikte parmağınla sürükleyerek zamanı değiştir.</div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('chart'),ctx=canvas.getContext('2d');
const slider=document.getElementById('time'),label=document.getElementById('label'),play=document.getElementById('play');
const levels=["Çok çok güzel","İnanılmaz","Efsane","Mükemmel","Akıl almaz","Tarifsiz","Olağanüstü","SINIRI YOK ∞"];

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.min(canvas.parentElement.clientWidth,1050);
  const h=Math.max(420,Math.min(650,w*.62));
  canvas.style.height=h+"px"; canvas.width=w*dpr; canvas.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
function draw(){
  const W=canvas.clientWidth,H=canvas.clientHeight;
  ctx.clearRect(0,0,W,H);
  const L=Math.max(78,W*.105), R=22, T=28, B=70;
  const pw=W-L-R, ph=H-T-B;
  
  ctx.strokeStyle="#4a4a4a";ctx.fillStyle="#4a4a4a";ctx.lineWidth=2;

  // axes
  ctx.beginPath();ctx.moveTo(L,H-B);ctx.lineTo(W-R,H-B);ctx.lineTo(W-R-12,H-B-7);
  ctx.moveTo(L,H-B);ctx.lineTo(L,T);ctx.lineTo(L-7,T+12);ctx.stroke();

  // labels
  ctx.font="700 13px Nunito, Arial";ctx.textAlign="center";
  ctx.fillText("Başlangıç",L,H-B+28);
  ctx.fillText("1",L+pw*.12,H-B+28);ctx.fillText("2",L+pw*.24,H-B+28);
  ctx.fillText("3",L+pw*.36,H-B+28);ctx.fillText("4",L+pw*.48,H-B+28);
  ctx.fillText("5",L+pw*.60,H-B+28);ctx.fillText("6",L+pw*.70,H-B+28);
  ctx.fillText("7",L+pw*.80,H-B+28);ctx.fillText("8",L+pw*.88,H-B+28);
  ctx.fillText("9",L+pw*.94,H-B+28);ctx.fillText("...",W-R,H-B+28);
  ctx.font="900 15px Nunito, Arial";ctx.fillText("ZAMAN",L+pw/2,H-20);

  ctx.save();ctx.translate(20,T+ph/2);ctx.rotate(-Math.PI/2);
  ctx.fillText("GÜZELLİK",0,0);ctx.restore();

  // horizontal guides
  ctx.setLineDash([5,6]);ctx.lineWidth=1;ctx.strokeStyle="#e0e0e0";
  for(let i=0;i<levels.length;i++){
    const y=T+ph-(i/(levels.length-1))*ph;
    ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.font="700 12px Nunito, Arial";ctx.textAlign="right";ctx.fillStyle="#666";
    ctx.fillText(levels[i],L-10,y+4);ctx.setLineDash([5,6]);
  }
  ctx.setLineDash([]);

  // exponential curve, clipped before final edge
  const maxT=9.15, shown=Math.max(.15,slider.value/100*maxT);
  const yMin=T+ph*.91, yTop=T+ph*.02;
  function curveY(x){
    const n=(Math.exp(.29*x)-1)/(Math.exp(.29*maxT)-1);
    return yMin-n*(yMin-yTop);
  }
  ctx.beginPath();ctx.lineWidth=5;ctx.strokeStyle="#ff477e";
  for(let x=0;x<=shown;x+=.035){
    const px=L+(x/maxT)*pw*.96, py=curveY(x);
    if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();

  // points
  ctx.fillStyle="#ff7096";
  for(let x=0;x<=Math.min(shown,9);x++){
    const px=L+(x/maxT)*pw*.96,py=curveY(x);
    ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  }

  // current marker
  const x=shown,px=L+(x/maxT)*pw*.96,py=curveY(x);
  ctx.fillStyle="#ff477e";
  ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.stroke();

  const shownLevel=x<1 ? levels[0] : levels[Math.min(levels.length-1,Math.floor(x/9*(levels.length-1)))];
  label.textContent=(x<.05?"Başlangıç":`Zaman ${x.toFixed(1)} — ${shownLevel}`);
}
slider.addEventListener("input",draw);
window.addEventListener("resize",resize);

let timer=null;
play.onclick=()=>{
  if(timer){clearInterval(timer);timer=null;play.textContent="▶";return}
  play.textContent="⏸";
  timer=setInterval(()=>{
    slider.value=+slider.value+1;
    if(+slider.value>=100){clearInterval(timer);timer=null;play.textContent="▶"}
    draw();
  },70);
};
resize();
</script>
</body>
</html>
